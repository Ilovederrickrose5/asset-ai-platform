name: asset-ai-platform

# 基础设施: Redis + Nacos
# MySQL 复用本机 Windows 服务 (localhost:3306), 已包含 asset_management 数据库
# 启动: docker compose up -d
# 停止: docker compose down

services:
  redis:
    # AI 知识库使用 Redis Vector Store(RediSearch), 必须是 redis-stack 镜像
    image: redis/redis-stack-server:7.4.0-v3
    container_name: asset-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.2.0
    container_name: asset-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # Nacos 3.x 认证必需项，需通过环境变量或 .env 文件提供
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN must be set}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE must be set}
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      # Nacos 3.x 已移除 /v1/console/health/* 接口，改用控制台首页探活
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
